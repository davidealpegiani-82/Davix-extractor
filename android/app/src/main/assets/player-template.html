function setStatus(s){statusEl.textContent=s}
function stopPlayer(){if(retryTimer){clearTimeout(retryTimer);retryTimer=null}if(watchdog){clearInterval(watchdog);watchdog=null}if(hls){try{hls.destroy()}catch(e){}hls=null}video.pause();video.removeAttribute('src');video.load();recovering=false;startupPending=false}
function bufferedAhead(){const t=video.currentTime||0;try{for(let i=0;i<video.buffered.length;i++){const a=video.buffered.start(i),b=video.buffered.end(i);if(t>=a-.5&&t<=b+.5)return Math.max(0,b-t)}}catch(e){}return 0}
function updateBuffer(){const s=bufferedAhead();bufferText.textContent=s.toFixed(1)+' s';bufferFill.style.width=Math.min(100,s/TARGET_BUFFER_SECONDS*100)+'%';bufferFill.style.background=s<15?'#f06b4a':s<MIN_BUFFER_SECONDS?'#f0a34a':'linear-gradient(90deg,#19b8df,#39dc9a)';return s}
function requestPlay(){startupPending=false;video.play().then(()=>{setStatus('In riproduzione: '+(CHANNELS[active]?.name||''))}).catch(()=>setStatus('Buffer pronto. Premi Play per avviare '+(CHANNELS[active]?.name||'')))}
function keepBufferLoading(force=false){
 if(!hls||active<0||fragmentLoading||levelLoading)return;
 const now=Date.now(),ahead=bufferedAhead();
 // Riattiva il loader solo se non ci sono richieste attive e HLS è davvero inattivo.
 if(!force||ahead>=TARGET_BUFFER_SECONDS||now-lastHlsActivity<5000||now-lastLoadKick<3000)return;
 lastLoadKick=now;
 try{hls.startLoad()}catch(e){}
}
function ensureHlsLoading(){
 if(!hls||active<0||fragmentLoading||levelLoading)return;
 const now=Date.now(),ahead=bufferedAhead();
 if(ahead>=TARGET_BUFFER_SECONDS||now-lastHlsActivity<5000||now-lastLoadKick<3000)return;
 keepBufferLoading(true);
}
function checkBufferPolicy(){
 const ahead=updateBuffer();
 if(startupPending){
  const waited=(Date.now()-startupSince)/1000;
  if(ahead>=START_BUFFER_SECONDS||(waited>=60&&ahead>=3)){requestPlay();return}
  setStatus('Precaricamento iniziale: '+ahead.toFixed(1)+' / '+START_BUFFER_SECONDS+' s');return;
 }
 if(!video.paused&&!video.ended&&ahead<MIN_BUFFER_SECONDS&&ahead<2)setStatus('Buffer basso: '+ahead.toFixed(1)+' s · attendo nuovi segmenti');
}
function beginPrebuffer(){startupPending=true;startupSince=Date.now();if(hls){try{hls.startLoad(-1)}catch(e){}}checkBufferPolicy()}
function recover(reason){if(retryTimer||active<0)return;if(retryCount>=retryDelays.length){setStatus('Flusso non disponibile dopo i tentativi automatici. Seleziona di nuovo il canale per riprovare.');return}const delay=retryDelays[retryCount++];recovering=true;setStatus(reason+' · ripristino '+retryCount+'/'+retryDelays.length);retryTimer=setTimeout(()=>{retryTimer=null;if(active>=0)startChannel(active,true)},delay)}
function recoverNetwork(reason){
 if(active<0||!hls||networkRetryTimer)return;
 const attempt=++networkRetryCount,delay=Math.min(1000*Math.pow(2,Math.min(attempt-1,2)),4000);
 recovering=true;setStatus(reason+' · riattivazione automatica '+attempt);
 networkRetryTimer=setTimeout(()=>{
  networkRetryTimer=null;if(!hls||active<0)return;
  try{lastLoadKick=Date.now();hls.startLoad()}catch(e){recovering=false;setStatus('Riattivazione HLS in corso…')}
 },delay);
}
function startWatchdog(){
 if(watchdog)clearInterval(watchdog);lastTime=video.currentTime||0;lastProgress=Date.now();

  if(video.paused||video.ended||active<0)return;
  const t=video.currentTime||0,ahead=bufferedAhead(),now=Date.now();

 },5000)
}
function startChannel(i,retry=false){const c=CHANNELS[i];if(!c)return;active=i;if(retryTimer){clearTimeout(retryTimer);retryTimer=null}if(networkRetryTimer){clearTimeout(networkRetryTimer);networkRetryTimer=null}networkRetryCount=0;if(hls){try{hls.destroy()}catch(e){}hls=null}fragmentLoading=false;levelLoading=false;lastHlsActivity=Date.now();video.pause();video.removeAttribute('src');video.load();startupPending=false;lastLoadKick=0;document.querySelectorAll('.channel').forEach((b,n)=>b.classList.toggle('active',n===i));setStatus((retry?'Ripristino: ':'Caricamento: ')+c.name);
 if(video.canPlayType('application/vnd.apple.mpegurl')&&!(window.Hls&&Hls.isSupported())){video.src=c.url;video.load();beginPrebuffer()}
 else if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:false,liveSyncDurationCount:8,liveMaxLatencyDurationCount:24,maxBufferLength:90,maxMaxBufferLength:90,maxBufferSize:90*1000*1000,backBufferLength:30,maxBufferHole:.1,highBufferWatchdogPeriod:2,startFragPrefetch:true,testBandwidth:true,abrEwmaDefaultEstimate:2000000,abrBandWidthFactor:.8,abrBandWidthUpFactor:.7,fragLoadingTimeOut:45000,manifestLoadingTimeOut:30000,manifestLoadingMaxRetry:6,levelLoadingMaxRetry:6,fragLoadingMaxRetry:8,fragLoadingRetryDelay:1000,fragLoadingMaxRetryTimeout:45000,nudgeMaxRetry:6,debug:false});hls.on(Hls.Events.MANIFEST_PARSED,()=>{lastHlsActivity=Date.now();beginPrebuffer()});hls.on(Hls.Events.LEVEL_LOADING,()=>{levelLoading=true;lastHlsActivity=Date.now()});hls.on(Hls.Events.LEVEL_LOADED,()=>{levelLoading=false;lastHlsActivity=Date.now()});hls.on(Hls.Events.FRAG_LOADING,()=>{fragmentLoading=true;lastHlsActivity=Date.now()});hls.on(Hls.Events.FRAG_LOADED,()=>{fragmentLoading=false;lastHlsActivity=Date.now()});hls.on(Hls.Events.FRAG_BUFFERED,()=>{fragmentLoading=false;lastHlsActivity=Date.now();networkRetryCount=0;recovering=false;checkBufferPolicy()});hls.on(Hls.Events.ERROR,(_,e)=>{if(e){if(e.details===Hls.ErrorDetails.FRAG_LOAD_ERROR||e.details===Hls.ErrorDetails.FRAG_LOAD_TIMEOUT){fragmentLoading=false;levelLoading=false;lastHlsActivity=Date.now()}if(e.fatal){if(e.type===Hls.ErrorTypes.NETWORK_ERROR){recoverNetwork('Errore di rete')}else if(e.type===Hls.ErrorTypes.MEDIA_ERROR){try{hls.recoverMediaError()}catch(_){recover('Errore del flusso')}}else recover('Errore del flusso')}}});hls.loadSource(c.url);hls.attachMedia(video)}
 else setStatus('HLS non supportato da questo browser. Usa Apri con DAVIX Player su Android.');
 startWatchdog();updateBuffer()}
function openLite(){
 if(active<0||!CHANNELS[active]){setStatus('Seleziona prima un canale.');return}
 const c=CHANNELS[active],q=new URLSearchParams({url:c.url,name:c.name});
 // Passa al player nativo il contesto HTTP reale del browser. Il browser aggiunge
 // automaticamente User-Agent e Origin alle richieste HLS cross-origin; Media3 no.
 try{
  const pageUrl=new URL(location.href),streamUrl=new URL(c.url);
  if(navigator.userAgent)q.set('ua',navigator.userAgent);
  if(pageUrl.origin)q.set('origin',pageUrl.origin);
  // Rispetta la referrer policy predefinita strict-origin-when-cross-origin.
  if(pageUrl.protocol==='http:'||pageUrl.protocol==='https:'){
   if(!(pageUrl.protocol==='https:'&&streamUrl.protocol==='http:')){
    const referrer=pageUrl.origin===streamUrl.origin?pageUrl.href:(pageUrl.origin==='null'?'':pageUrl.origin+'/');
    if(referrer)q.set('referer',referrer);
   }
  }
 }catch(e){}
 location.href='intent://play?'+q.toString()+'#Intent;scheme=skylite;package=it.davidealpegiani.skylite;S.browser_fallback_url='+encodeURIComponent(APK_URL)+';end'
}

function openKeyDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open('sky-player-key-store',1);req.onupgradeneeded=()=>req.result.createObjectStore('keys');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function getDeviceSecret(state){if(state.deviceSecret)return state.deviceSecret;if(!state.secretCipher||!window.crypto?.subtle||!window.indexedDB)return null;const db=await openKeyDb();const key=await new Promise((resolve,reject)=>{const tx=db.transaction('keys','readonly'),req=tx.objectStore('keys').get('device-key');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});db.close();if(!key)return null;const packed=Uint8Array.from(atob(state.secretCipher),c=>c.charCodeAt(0)),iv=packed.slice(0,12),cipher=packed.slice(12);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,cipher);return new TextDecoder().decode(plain)}
async function storeDeviceSecret(state,secret){try{if(!window.crypto?.subtle||!window.indexedDB)throw new Error('secure storage unavailable');const db=await openKeyDb();let key=await new Promise((resolve,reject)=>{const tx=db.transaction('keys','readonly'),req=tx.objectStore('keys').get('device-key');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});if(!key){key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await new Promise((resolve,reject)=>{const tx=db.transaction('keys','readwrite');tx.objectStore('keys').put(key,'device-key');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}const iv=crypto.getRandomValues(new Uint8Array(12)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(secret));const packed=new Uint8Array(iv.length+cipher.byteLength);packed.set(iv);packed.set(new Uint8Array(cipher),iv.length);state.secretCipher=btoa(String.fromCharCode(...packed));delete state.deviceSecret;db.close()}catch(e){state.deviceSecret=secret}return state}
function clearCloudAuthorization(){try{localStorage.removeItem(CLOUD_STORAGE_KEY);if(window.indexedDB){const req=indexedDB.deleteDatabase('sky-player-key-store');req.onerror=()=>{}}}catch(e){}CHANNELS=[];CATEGORIES=[];stopPlayer();active=-1;renderChannels(false);activationInput.hidden=false;cloudButton.hidden=false;cloudStatus.textContent='Autorizzazione revocata o non valida. Serve un nuovo codice.'}
function randomToken(){const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);let raw='';bytes.forEach(v=>raw+=String.fromCharCode(v));return btoa(raw).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function randomId(){const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);return Array.from(bytes,v=>v.toString(16).padStart(2,'0')).join('')}
async function cloudRequest(path,options={}){const res=await fetch(CLOUD_SYNC_URL+path,options);let data={};try{data=await res.json()}catch(e){}if(!res.ok)throw new Error(data.error||('HTTP '+res.status));return data}

function normalizeEpgName(value){return String(value||'').toLowerCase().replace(/\b(full|hd|fhd|uhd|4k|hevc|h\.?265|h\.?264|1080p|720p|sd)\b/g,' ').replace(/[^\p{L}\p{N}+]+/gu,' ').trim().replace(/\s+/g,' ')}
function parseXmltvDate(value){const m=String(value||'').match(/^(\d{14})(?:\s*([+-])(\d{2})(\d{2}))?/);if(!m)return 0;const s=m[1],base=Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(8,10),+s.slice(10,12),+s.slice(12,14));const offset=m[2]?(+(m[3])*60+(+m[4]))*(m[2]==='+'?1:-1):0;return base-offset*60000}
function parseXmltv(xmlText){const doc=new DOMParser().parseFromString(xmlText,'application/xml');if(doc.querySelector('parsererror'))throw new Error('XMLTV non valido');const names=new Map(),programmes=new Map();Array.from(doc.getElementsByTagName('channel')).forEach(node=>{const id=node.getAttribute('id');if(!id)return;const aliases=Array.from(node.getElementsByTagName('display-name')).map(x=>x.textContent||'').filter(Boolean);names.set(id,aliases)});Array.from(doc.getElementsByTagName('programme')).forEach(node=>{const id=node.getAttribute('channel'),start=parseXmltvDate(node.getAttribute('start')),stop=parseXmltvDate(node.getAttribute('stop')),title=node.getElementsByTagName('title')[0]?.textContent?.trim()||'';if(!id||!start||!stop||!title||stop<=Date.now())return;if(!programmes.has(id))programmes.set(id,[]);programmes.get(id).push({start,stop,title})});return {names,programmes}}
function epgSimilarity(a,b){if(!a||!b)return 0;if(a===b)return 1;let prev=Array.from({length:b.length+1},(_,i)=>i),cur=new Array(b.length+1);for(let i=0;i<a.length;i++){cur[0]=i+1;for(let j=0;j<b.length;j++)cur[j+1]=Math.min(cur[j]+1,prev[j+1]+1,prev[j]+(a[i]===b[j]?0:1));const swap=prev;prev=cur;cur=swap}return 1-prev[b.length]/Math.max(a.length,b.length)}
function matchEpgChannel(channel,dataset){const ids=Array.from(dataset.names.keys());if(channel.tvgId){const exact=ids.find(id=>id.toLowerCase()===channel.tvgId.toLowerCase());if(exact)return exact}const targets=[channel.tvgName,channel.name].map(normalizeEpgName).filter(Boolean);if(!targets.length)return null;const exact=ids.filter(id=>(dataset.names.get(id)||[]).some(n=>targets.includes(normalizeEpgName(n))));if(exact.length===1)return exact[0];if(exact.length>1)return null;const scores=ids.map(id=>[id,Math.max(...(dataset.names.get(id)||[]).map(n=>Math.max(...targets.map(t=>epgSimilarity(t,normalizeEpgName(n))))),0)]).sort((a,b)=>b[1]-a[1]);return scores[0]&&scores[0][1]>=.92&&scores[0][1]-(scores[1]?.[1]||0)>=.10?scores[0][0]:null}
async function readXmltvResponse(response){const bytes=new Uint8Array(await response.arrayBuffer());if(bytes[0]===31&&bytes[1]===139){if(!window.DecompressionStream)throw new Error('Questo browser non supporta la decompressione GZIP');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).text()}return new TextDecoder('utf-8').decode(bytes)}
async function refreshEpg(){if(epgRefreshRunning||!CHANNELS.length)return;epgRefreshRunning=true;epgStatus.textContent='EPG: recupero palinsesti e associazione automatica…';const sources=[['sky','Sky Italia'],['iptv','IPTV-EPG Italia'],['epgshare','EPG Share Italia'],['open3','Open EPG Italia 3'],['open8','Open EPG Italia 8']];try{const state=cloudState(),secret=await getDeviceSecret(state);if(!secret)throw new Error('Credenziali Cloud Sync non disponibili');const datasets=[];let cursor=0;const worker=async()=>{while(cursor<sources.length){const index=cursor++,[sourceKey,label]=sources[index];try{const response=await fetch(CLOUD_SYNC_URL+'/v1/epg?source='+encodeURIComponent(sourceKey),{headers:{Authorization:'Bearer '+secret},cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);datasets.push([label,parseXmltv(await readXmltvResponse(response))])}catch(e){}}};await Promise.all([worker(),worker(),worker()]);const now=Date.now(),result={};let matched=0;const used=new Set();CHANNELS.forEach(channel=>{const found=[];datasets.forEach(([label,data])=>{const id=matchEpgChannel(channel,data);if(!id)return;const items=(data.programmes.get(id)||[]).filter(p=>p.stop>now);found.push({label,items});used.add(label)});if(!found.length)return;const merged=found.flatMap(x=>x.items).sort((a,b)=>a.start-b.start||a.stop-b.stop).filter((p,i,all)=>all.findIndex(x=>x.start===p.start&&x.stop===p.stop)===i);const current=merged.find(p=>p.start<=now&&p.stop>now),next=merged.find(p=>p.start>now);result[channel.url]={nowTitle:current?.title||'',nextTitle:next?.title||'',nowStartMs:current?.start||0,nowStopMs:current?.stop||0};matched++});epgGuides=result;try{localStorage.setItem(EPG_CACHE_KEY,JSON.stringify(result))}catch(e){}renderChannels(false);const nowCount=Object.values(result).filter(x=>x.nowTitle).length;epgStatus.textContent='EPG aggiornato · '+matched+'/'+CHANNELS.length+' canali associati · '+nowCount+' programmi in onda · '+Array.from(used).join(' + ')}catch(e){epgStatus.textContent='EPG non aggiornato: '+(e.message||'fonti non raggiungibili')+'. La guida salvata resta disponibile.'}finally{epgRefreshRunning=false}}
function updateListTitle(){const key=expandedCategoryKey;listTitle.textContent=!key?'I TUOI CANALI':key==='special:favorites'?'★ PREFERITI':key==='special:uncategorized'?'DA CLASSIFICARE':key.replace('category:','').toUpperCase()}
function renderChannels(autoStart=false,target=list){
 target.innerHTML='';if(target===list)updateListTitle();
 if(!CHANNELS.length){target.innerHTML='<div class="status">Attiva questo dispositivo con un codice monouso per visualizzare i canali.</div>';if(target===list)setStatus('Attiva questo dispositivo con un codice monouso per visualizzare i canali.');return}
 const appendChannel=(c,i)=>{const row=document.createElement('div');row.className='row';const b=document.createElement('button');b.type='button';b.className='channel'+(active===i?' active':'');b.setAttribute('aria-label','Riproduci '+c.name);const labels=document.createElement('span');labels.className='name';const name=document.createElement('span');name.textContent=c.name;labels.appendChild(name);const guide=epgGuides[c.url];if(guide&&(guide.nowTitle||guide.nextTitle)){const epg=document.createElement('span');epg.className='epg';epg.textContent=(guide.nowTitle?'ORA'+(guide.nowStartMs?'  '+new Date(guide.nowStartMs).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})+'–'+new Date(guide.nowStopMs).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'')+'  ·  '+guide.nowTitle:'')+(guide.nextTitle?((guide.nowTitle?'\n':'')+'DOPO  ·  '+guide.nextTitle):'');labels.appendChild(epg)}b.appendChild(labels);b.addEventListener('click',()=>{if(!hasValidLease()){setStatus('Attivazione richiesta.');return}retryCount=0;startChannel(i);if(target===fsDrawerList)fsDrawer.hidden=true});row.appendChild(b);const fav=document.createElement('button');fav.type='button';fav.className='favorite'+(favoriteUrls.has(c.url)?' on':'');fav.textContent=favoriteUrls.has(c.url)?'★':'☆';fav.setAttribute('aria-label',favoriteUrls.has(c.url)?'Rimuovi dai preferiti':'Aggiungi ai preferiti');fav.addEventListener('click',()=>{if(favoriteUrls.has(c.url))favoriteUrls.delete(c.url);else favoriteUrls.add(c.url);try{localStorage.setItem(FAVORITES_KEY,JSON.stringify(Array.from(favoriteUrls)))}catch(e){}renderChannels(false);if(document.fullscreenElement)renderChannels(false,fsDrawerList)});row.appendChild(fav);if(android){const app=document.createElement('button');app.type='button';app.className='native';app.textContent='APP';app.setAttribute('aria-label','Apri '+c.name+' in DAVIX Player');app.addEventListener('click',()=>{if(!hasValidLease())return;active=i;openLite()});row.appendChild(app)}target.appendChild(row)};
 const visibleChannels=CHANNELS.map((channel,index)=>({channel,index})).filter(x=>!channelSearchTerm||(String(x.channel.name||'')+' '+String(x.channel.category||'')).toLocaleLowerCase('it').includes(channelSearchTerm));
 const paths=Array.from(new Set([...CATEGORIES,...visibleChannels.map(x=>x.channel.category||'Non classificati')].map(x=>String(x||'').split('>').map(y=>y.trim()).filter(Boolean).join(' > ')).filter(x=>x&&!/^non classificati$/i.test(x)))).filter(path=>visibleChannels.some(x=>String(x.channel.category||'').trim().toLowerCase()===path.toLowerCase())).sort((a,b)=>a.localeCompare(b,'it'));
 const roots=[...new Set(paths.map(path=>path.split('>').map(part=>part.trim()).filter(Boolean)[0]).filter(Boolean))];
 const rendered=new Set();
 const addFolder=(title,key,items)=>{const expanded=expandedCategoryKey===key;const folder=document.createElement('button');folder.type='button';folder.className='category-title';folder.textContent=(expanded?'▾  ':'▸  ')+title.toUpperCase()+'    ·  '+items.length;folder.setAttribute('aria-expanded',String(expanded));folder.addEventListener('click',()=>{expandedCategoryKey=expanded?'':key;renderChannels(false,target);if(isTvMode())target.querySelector('.category-title')?.focus()});target.appendChild(folder);if(expanded)items.forEach(x=>appendChannel(x.channel,x.index))};
 const favorites=visibleChannels.filter(x=>favoriteUrls.has(x.channel.url));if(favorites.length){addFolder('★ Preferiti','special:favorites',favorites);favorites.forEach(x=>rendered.add(x.channel.url))}
 paths.forEach(path=>{const items=visibleChannels.filter(x=>String(x.channel.category||'Non classificati').trim().toLowerCase()===path.toLowerCase()&&!rendered.has(x.channel.url));if(items.length){addFolder(path,'category:'+path,items);items.forEach(x=>rendered.add(x.channel.url))}});
 const uncategorized=visibleChannels.filter(x=>!rendered.has(x.channel.url));if(uncategorized.length)addFolder('Da classificare','special:uncategorized',uncategorized);

function isTvMode(){return /Android TV|AFT|Fire TV|SMART-TV|Tizen|Web0S/i.test(navigator.userAgent)||window.matchMedia('(pointer: coarse)').matches}
function hasValidLease(){const state=cloudState();return !!(state.deviceSecret||state.secretCipher)&&Number(state.leaseExpiresAt||0)>Date.now()}
async function syncCloudConfig(){if(!CLOUD_SYNC_URL||!hasValidLease())return;lastCloudCheck=Date.now();const state=cloudState();try{const deviceSecret=await getDeviceSecret(state);if(!deviceSecret)throw new Error('device_credential_missing');const data=await cloudRequest('/v1/config?sinceVersion='+(state.version||0),{headers:{Authorization:'Bearer '+deviceSecret}});const leaseExpiresAt=Number(data.leaseExpiresAt||0);if(leaseExpiresAt<=Date.now())throw new Error('offline_lease_expired');if(data.unchanged){saveCloudState({...state,leaseExpiresAt});cloudStatus.textContent='Lista aggiornata · licenza rinnovata';return}const incoming=data.config&&data.config.channels;const incomingCategories=data.config&&Array.isArray(data.config.categories)?data.config.categories:[];if(!Array.isArray(incoming)||incoming.length>1000||!incoming.every(c=>c&&typeof c.name==='string'&&typeof c.url==='string'&&/^https?:\/\//i.test(c.url))||incomingCategories.length>100||!incomingCategories.every(c=>typeof c==='string'&&c.trim().length>0&&c.length<=80)){throw new Error('Configurazione ricevuta non valida')}CHANNELS=incoming;CATEGORIES=incomingCategories;saveCloudState({...state,version:data.version,config:data.config,leaseExpiresAt});stopPlayer();active=-1;epgGuides={};try{localStorage.removeItem(EPG_CACHE_KEY)}catch(e){}renderChannels(false);cloudStatus.textContent='Lista autorizzata · '+incoming.length+' canali';refreshEpg()}catch(e){if(String(e.message||'').includes('device_not_authorized')||String(e.message||'').includes('offline_lease_expired')){clearCloudAuthorization();return}const cached=cloudState();if(Number(cached.leaseExpiresAt||0)<=Date.now()){clearCloudAuthorization();return}cloudStatus.textContent='Offline: uso la configurazione autorizzata fino alla scadenza della licenza.'}}
async function pairCloudPlayer(){if(!CLOUD_SYNC_URL){cloudStatus.textContent='Cloud Sync non configurato nell’esportazione.';return}try{const code=activationInput.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(!/^[A-HJ-NP-Z2-9]{10}$/.test(code)){activationInput.focus();throw new Error('Inserisci il codice monouso di 10 caratteri generato da DAVIX Extractor.')}const state=cloudState();const deviceSecret=await getDeviceSecret(state)||randomToken(),installId=state.installId||randomId();const activated=await cloudRequest('/v2/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,deviceSecret,installId,deviceName:(navigator.userAgent||'Browser').slice(0,100),platform:'html'})});if(!activated.activated||Number(activated.leaseExpiresAt)<=Date.now())throw new Error('Attivazione non confermata dal server');const secureState=await storeDeviceSecret({installId,version:0,leaseExpiresAt:activated.leaseExpiresAt,config:null},deviceSecret);if(!saveCloudState(secureState))throw new Error('Impossibile salvare l’autorizzazione locale');activationInput.hidden=true;cloudButton.hidden=true;cloudStatus.textContent='Dispositivo attivato. Caricamento configurazione…';await syncCloudConfig()}catch(e){cloudStatus.textContent=e.message||'Attivazione non riuscita.'}}
cloudButton.hidden=false;
cloudButton.textContent='ATTIVA DISPOSITIVO';
cloudButton.addEventListener('click',pairCloudPlayer);
const cached=cloudState();
if(Number(cached.leaseExpiresAt||0)>Date.now()&&(Array.isArray(cached.config)||Array.isArray(cached.config&&cached.config.channels))){const saved=Array.isArray(cached.config)?{channels:cached.config,categories:[]}:cached.config;CHANNELS=saved.channels;CATEGORIES=Array.isArray(saved.categories)?saved.categories:[];activationInput.hidden=true;cloudButton.hidden=true;renderChannels(false);cloudStatus.textContent='Configurazione autorizzata disponibile offline.';if(Object.keys(epgGuides).length)epgStatus.textContent='EPG disponibile · guida salvata in cache';refreshEpg();if(CLOUD_SYNC_URL)syncCloudConfig()}else{clearCloudAuthorization();activationInput.hidden=false;cloudButton.hidden=false}
setInterval(()=>{if(!hasValidLease()&&CHANNELS.length)clearCloudAuthorization();else if(hasValidLease()&&Date.now()-lastCloudCheck>6*60*60*1000)syncCloudConfig();ensureHlsLoading();checkBufferPolicy()},1500);
