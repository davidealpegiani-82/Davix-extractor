name: Restore android-apk.yml

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore workflow from known-good commit
        run: |
          set -euo pipefail
          git show e6d64fd616a82d517af5b214ea8057edc576c899:.github/workflows/android-apk.yml > .github/workflows/android-apk.yml
          python3 << 'PY'
          from pathlib import Path
          p = Path(".github/workflows/android-apk.yml")
          t = p.read_text(encoding="utf-8")
          # version bump also on manual runs
          t = t.replace(
              "if: github.event_name == 'push' && github.ref == 'refs/heads/main'\n        shell: bash\n        run: |\n          set -euo pipefail\n          manifest_url=",
              "if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')\n        shell: bash\n        run: |\n          set -euo pipefail\n          manifest_url=",
              1,
          )
          t = t.replace(
              "if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.apk-signing.outputs.stable_signing == 'true'",
              "if: github.ref == 'refs/heads/main' && steps.apk-signing.outputs.stable_signing == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')",
              1,
          )
          assert '("extractor", "DAVIX_EXTRACTOR")' in t
          assert "Prepare automatic app versions" in t
          assert "DAVIX_BUILD_TYPE" in t
          p.write_text(t, encoding="utf-8")
          print("ok", p.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/android-apk.yml
          if git diff --cached --quiet; then echo "no change"; else git commit -m "ci: ripristina android-apk.yml completo (versioning + assemble)" && git push; fi
