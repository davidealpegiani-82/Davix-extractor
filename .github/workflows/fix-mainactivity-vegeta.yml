name: Fix MainActivity Vegeta IT

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and patch MainActivity
        run: |
          set -euo pipefail
          TARGET="android/app/src/main/java/it/davidealpegiani/skyunoextractor/MainActivity.kt"
          git show 49b935534facfecc7f4749a320f78bdcc2dcb970:"$TARGET" > "$TARGET"
          python3 android/scripts/patch-mainactivity-vegeta.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/it/davidealpegiani/skyunoextractor/MainActivity.kt
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "fix(android): ripristina MainActivity e aggiunge Importa server Vegeta IT"
            git push
          fi
