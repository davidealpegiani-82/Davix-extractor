name: DAVIX source verification

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "cloud-sync/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify player template and category flows
        run: node android/scripts/verify-player-template.mjs
      - name: Verify updater background I/O
        run: node android/scripts/verify-updater-background.mjs
      - name: Verify import memory retention
        run: node android/scripts/verify-import-memory.mjs
